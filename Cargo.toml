[workspace]
members = ["crates/launcher", "crates/prism", "crates/app"]
resolver = "2"

[workspace.dependencies]
gpui = { version = "0.2.1" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
parking_lot = { version = "0.11.1" }


[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
